# AI-trainer taxonomy. Used for (1) job relevance filtering, (2) ATS keyword coverage, (3) normalising domains.
# Each entry: canonical name -> list of synonyms (all lower-case, matched as whole words / phrases).

domains:
  coding: [coding, programming, software engineer, python, javascript, typescript, java, c++, rust, golang, sql, code review, debugging, algorithms, full-stack, backend, frontend]
  math: [mathematics, math, calculus, algebra, statistics, probability, proofs, linear algebra, number theory]
  physics: [physics, quantum, mechanics, thermodynamics, astrophysics]
  chemistry: [chemistry, organic chemistry, biochemistry, chemical engineering]
  biology: [biology, genetics, molecular biology, neuroscience, bioinformatics]
  medicine: [medicine, medical, clinical, physician, md, nurse, pharmacist, healthcare, radiology]
  law: [law, legal, attorney, lawyer, jd, paralegal, compliance, contract]
  finance: [finance, financial, accounting, cpa, cfa, economics, investment, banking, quantitative]
  engineering: [engineering, mechanical, electrical, civil, aerospace, robotics, embedded]
  creative writing: [creative writing, fiction, poetry, screenwriting, copywriting, editing, journalism, storytelling]
  languages: [bilingual, multilingual, translation, translator, linguistics, native speaker, localization, spanish, french, german, japanese, korean, chinese, arabic, hindi, portuguese]
  humanities: [history, philosophy, literature, psychology, sociology, political science, education, teaching]
  general: [generalist, general knowledge, research, fact-checking]

task_types:
  rlhf ranking: [rlhf, preference ranking, ranking responses, comparing responses, pairwise comparison, reward model, human feedback]
  sft writing: [sft, supervised fine-tuning, write prompts, prompt writing, response writing, demonstration data, instruction data]
  red teaming: [red teaming, red team, adversarial, jailbreak, safety evaluation, harmful content, trust and safety]
  evaluation: [evaluation, evals, benchmark, model evaluation, grading, quality assurance, qa, fact check, factuality]
  rubric design: [rubric, rubrics, criteria, scoring guidelines, grading rubric]
  annotation: [annotation, labeling, data labeling, tagging, transcription, data quality]
  prompt engineering: [prompt engineering, prompt engineer, prompt design, chain of thought, few-shot]
  code review: [code review, code evaluation, code generation, unit tests, pull request]
  agentic: [agent, agentic, tool use, function calling, browser use, computer use, trajectories]

