# Relevance filter (all matching is whole-word, case-insensitive, on the job TITLE unless noted).
#  strict  (company career boards): keep when a strong/title keyword hits and no exclude keyword hits
#          (an exclude keyword is ignored when the title also has a strong keyword).
#  relaxed (legacy / keep_irrelevant=False with strict=False): additionally keep when the
#          description has at least `relaxed_body_hits` body keywords. Exclusions still apply.
# Note: some postings write "AI" as "Al" (lowercase L), so both spellings are listed.
relevance:
  relaxed_body_hits: 2
  strong_title_keywords:
    - ai trainer
    - al trainer
    - ai tutor
    - al tutor
    - ai training
    - rlhf
    - data annotation
    - annotator
    - annotation specialist
    - model evaluator
    - ai evaluator
    - llm evaluator
    - prompt engineer
    - ai red teamer
    - red teamer
  title_keywords:
    - fellow
    - generative ai
    - generative al
    - subject matter expert
    - sme
    - domain expert
    - expert reviewer
    - expert contributor
    - expert
    - talent network
    - ai quality
    - quality reviewer
    - ai reviewer
    - ai writer
    - ai expert
    - ai specialist
    - ai contractor
    - llm trainer
    - model trainer
    - human data
    - freelance ai
    - coding specialist
    - math specialist
    - evaluator
    - rater
    - tasker
    - contributor
    - labeling specialist
    - data specialist
    - knowledge expert
    - professional expert
    - independent contractor
    - contractor - ai
  # Always drop unless a strong trainer keyword also appears in the title.
  hard_exclude_title_keywords:
    - recruiter
    - recruiting
    - sourcer
    - talent acquisition
    - talent partner
    - account executive
    - account manager
  exclude_title_keywords:
    - recruiter
    - recruiting
    - sourcer
    - talent
