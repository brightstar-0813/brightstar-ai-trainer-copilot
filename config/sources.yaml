# Where jobs come from. Public ATS boards only — LinkedIn job scraping is not supported.
#
# `slugs` are guesses; `jt sources discover` (also run by Fetch) probes Greenhouse/Lever/Ashby
# and caches hits in data/verified_boards.json for `jt collect`.

collect:
  # Drop postings older than this many days (unknown dates are kept).
  max_age_days: 30

# Always collect these boards (in addition to slug discovery). Critical AI-training sources.
boards:
  - { company: Handshake, ats: ashby, slug: Handshake }
  - { company: Surge AI, ats: ashby, slug: surge-ai }
  - { company: Scale AI, ats: greenhouse, slug: scaleai }
  - { company: xAI, ats: greenhouse, slug: xai }
  - { company: Mercor Staff, ats: ashby, slug: mercor }
  - { company: Labelbox, ats: greenhouse, slug: labelbox }
  - { company: OpenAI, ats: greenhouse, slug: openai }
  - { company: Anthropic, ats: greenhouse, slug: anthropic }

# AI-training / RLHF / annotation / domain-expert marketplaces + labs across industries.
# Mercor *expert* contract roles come from work.mercor.com via `jt collect --mercor` (not ATS).
companies:
