[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jt"
version = "0.1.0"
description = "AI Trainer Job Copilot: collect jobs, analyze with logged-in Claude/GPT, tailor resumes"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48",
  "httpx>=0.27",
  "websockets>=13",
  "sqlmodel>=0.0.22",
  "typer>=0.12",
  "pydantic>=2.8",
  "pyyaml>=6",
  "jinja2>=3.1",
  "rapidfuzz>=3.9",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "streamlit>=1.38",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jt = "jt.cli:app"

[tool.setuptools.packages.find]
include = ["jt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
