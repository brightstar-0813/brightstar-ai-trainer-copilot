# Collect filter: keep only remote roles US candidates can apply to / work from.
# Matching is whole-word / phrase, case-insensitive (same as relevance).
eligibility:
  remote_keywords:
    - remote
    - remotely
    - work from home
    - work-from-home
    - wfh
    - distributed
    - anywhere
  us_positive_keywords:
    - united states
    - u.s.
    - u.s.a.
    - usa
    - us only
    - us-based
    - us based
    - based in the us
    - based in the united states
    - located in the us
    - located in the united states
    - work authorization in the us
    - authorized to work in the us
    - authorized to work in the united states
    - must be in the us
    - must live in the us
    - remote us
    - remote - us
    - remote (us)
    - us remote
  # Location-only foreign markers (reject unless location also has a US positive).
  foreign_geo_keywords:
