<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mock chat</title>
  <style>
    body { font: 14px sans-serif; max-width: 760px; margin: 20px auto; }
    #editor { border: 1px solid #888; min-height: 60px; padding: 6px; white-space: pre-wrap; }
    .user-msg { background: #eef; margin: 6px 0; padding: 6px; white-space: pre-wrap; }
    .assistant-msg { background: #efe; margin: 6px 0; padding: 6px; }
    #stop { display: none; }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="editor" contenteditable="true"></div>
  <button id="send" disabled>Send</button>
  <button id="stop">Stop</button>
  <script>
    const editor = document.getElementById('editor');
    const send = document.getElementById('send');
    const stop = document.getElementById('stop');
    const log = document.getElementById('log');
    const refresh = () => { send.disabled = !editor.innerText.trim(); };
    editor.addEventListener('input', refresh);
    new MutationObserver(refresh).observe(editor, { childList: true, subtree: true, characterData: true });

    function reply(prompt) {
      if (/usage-limit-test/.test(prompt)) return null;
      if (/"ok": true/.test(prompt)) return 'Sure, here you go:\n```json\n{"ok": true}\n```';
      if (/fix-json-test/.test(prompt)) return 'not json at all';
      const n = document.querySelectorAll('.user-msg').length;  // messages in this conversation so far
      return 'ECHO(' + prompt.length + ') msgs=' + n + ': ' + prompt.slice(0, 80);
    }

    async function doSend() {
      const text = editor.innerText.trim();
      if (!text) return;
      editor.innerHTML = '';
      refresh();
      const u = document.createElement('div'); u.className = 'user-msg'; u.textContent = text; log.appendChild(u);
      const r = reply(text);
      if (r === null) {
        const a = document.createElement('div'); a.className = 'alert'; a.setAttribute('role', 'alert');
        a.textContent = 'You have reached your usage limit'; document.body.appendChild(a); return;
      }
      const a = document.createElement('div'); a.className = 'assistant-msg'; log.appendChild(a);
      stop.style.display = 'inline';
      let shown = '';
      for (const ch of r) {
        shown += ch;
        // render fenced block as <pre><code>, rest as paragraph text
        const m = /^([\s\S]*?)```json\n([\s\S]*?)(?:\n```)?$/.exec(shown);
        a.innerHTML = '';
        if (m) {
          const p = document.createElement('p'); p.textContent = m[1]; a.appendChild(p);
          const pre = document.createElement('pre'); const code = document.createElement('code');
          code.className = 'language-json'; code.textContent = m[2]; pre.appendChild(code); a.appendChild(pre);
        } else { const p = document.createElement('p'); p.textContent = shown; a.appendChild(p); }
        await new Promise((res) => setTimeout(res, 15));
      }
      stop.style.display = 'none';
    }
    send.addEventListener('click', doSend);
  </script>
</body>
</html>
